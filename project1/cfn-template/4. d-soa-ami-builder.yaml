AWSTemplateFormatVersion: '2010-09-09'
Description: 'EC2 Image Builder Pipeline với Manual Trigger và Custom Resource để track AMI build status'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'VPC ID để build AMI'
  
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: 'Subnet ID (nên là private subnet với NAT Gateway)'
  
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'Security Group ID cho EC2 instance builder'
  
  GitRepositoryUrl:
    Type: String
    Default: 'https://github.com/cloud-mentor-pro/soa-project-backend'
    Description: 'GitHub repository URL'
  
  DBUrlParameterPath:
    Type: String
    Default: '/myapp/database/soa-param-codeland-db-url'
    Description: 'SSM Parameter Store path cho DB URL (host)'
  
  DBPasswordSecretId:
    Type: String
    Default: 'myapp/database/soa-secret-codeland-db-password'
    Description: 'Secrets Manager secret ID cho DB Password'
  
  AutoBuildOnCreate:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: 'Tự động build AMI khi tạo stack'

Resources:
  # ==========================================
  # IAM Role và Instance Profile
  # ==========================================
  ImageBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ImageBuilder-Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/EC2InstanceProfileForImageBuilder
      Policies:
        - PolicyName: ParameterStoreReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParameterHistory
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/myapp/*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:myapp/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
      Tags:
        - Key: Name
          Value: 'SOA-ImageBuilderRole-EC2BuilderRole'
        - Key: Environment
          Value: 'SOA'
        - Key: ManagedBy
          Value: 'CloudFormation'

  ImageBuilderInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-ImageBuilder-Profile'
      Roles:
        - !Ref ImageBuilderRole

  # ==========================================
  # Lambda Role cho Custom Resource
  # ==========================================
  AMIBuilderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-AMIBuilder-Lambda-Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ImageBuilderAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - imagebuilder:StartImagePipelineExecution
                  - imagebuilder:GetImagePipeline
                  - imagebuilder:ListImagePipelineImages
                  - imagebuilder:GetImage
                  - imagebuilder:CancelImageCreation
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:DescribeImages
                  - ec2:DescribeImageAttribute
                Resource: '*'
      Tags:
        - Key: Name
          Value: 'SOA-LambdaRole-AMIBuilderFunction'
        - Key: Environment
          Value: 'SOA'

  # ==========================================
  # Lambda Function để track AMI build
  # ==========================================
  AMIBuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-AMIBuilder'
      Description: 'Custom Resource để build và track AMI status'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AMIBuilderLambdaRole.Arn
      Timeout: 900  # 15 minutes timeout
      Code:
        ZipFile: |
          import boto3
          import json
          import time
          import cfnresponse
          
          imagebuilder = boto3.client('imagebuilder')
          ec2 = boto3.client('ec2')
          
          def handler(event, context):
              try:
                  request_type = event['RequestType']
                  pipeline_arn = event['ResourceProperties']['PipelineArn']
                  auto_build = event['ResourceProperties'].get('AutoBuild', 'true')
                  
                  if request_type == 'Create' or request_type == 'Update':
                      if auto_build == 'false':
                          # Không auto build, return success
                          cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                              'Status': 'Manual trigger mode - no auto build',
                              'PipelineArn': pipeline_arn
                          })
                          return
                      
                      # Start pipeline execution
                      print(f"Starting pipeline execution for: {pipeline_arn}")
                      response = imagebuilder.start_image_pipeline_execution(
                          imagePipelineArn=pipeline_arn
                      )
                      
                      build_arn = response['imageBuildVersionArn']
                      print(f"Build started with ARN: {build_arn}")
                      
                      # Poll for completion
                      max_attempts = 180  # 180 * 5 seconds = 15 minutes
                      attempts = 0
                      
                      while attempts < max_attempts:
                          time.sleep(5)
                          attempts += 1
                          
                          # Get build status
                          images = imagebuilder.list_image_pipeline_images(
                              imagePipelineArn=pipeline_arn,
                              maxResults=1
                          )
                          
                          if images['imageSummaryList']:
                              latest_image = images['imageSummaryList'][0]
                              state = latest_image.get('state', {}).get('status', 'PENDING')
                              
                              print(f"Build status: {state} (attempt {attempts}/{max_attempts})")
                              
                              if state == 'AVAILABLE':
                                  # AMI build complete
                                  output_resources = latest_image.get('outputResources', {})
                                  amis = output_resources.get('amis', [])
                                  
                                  ami_id = amis[0].get('image') if amis else 'N/A'
                                  
                                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                                      'Status': 'AMI Build Complete',
                                      'AMIId': ami_id,
                                      'BuildArn': build_arn,
                                      'State': state
                                  }, ami_id)
                                  return
                              
                              elif state in ['FAILED', 'CANCELLED']:
                                  reason = latest_image.get('state', {}).get('reason', 'Unknown error')
                                  cfnresponse.send(event, context, cfnresponse.FAILED, {
                                      'Error': f'Build failed with state: {state}',
                                      'Reason': reason
                                  })
                                  return
                      
                      # Timeout - nhưng vẫn return success với warning
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                          'Status': 'Build in progress - timeout reached',
                          'Warning': 'AMI build is still running in background',
                          'BuildArn': build_arn
                      })
                      
                  elif request_type == 'Delete':
                      # Không cần làm gì khi delete
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                          'Status': 'Delete successful'
                      })
                      
              except Exception as e:
                  print(f"Error: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {
                      'Error': str(e)
                  })
      Tags:
        - Key: Name
          Value: 'SOA-Lambda-AMIBuilderFunction'
        - Key: Environment
          Value: 'SOA'

  # ==========================================
  # Build Component
  # ==========================================
  ApplicationBuildComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: !Sub '${AWS::StackName}-build-component'
      Version: '1.0.0'
      Platform: Linux
      Description: 'Component cài đặt Python 3.12, dependencies và setup application'
      SupportedOsVersions:
        - 'Amazon Linux 2023'
      Tags:
        Name: 'SOA-Component-ApplicationBuild'
        Environment: 'SOA'
        Purpose: 'BuildAndInstall'
      Data: !Sub |
        name: ApplicationSetupComponent
        description: Cài đặt và cấu hình ứng dụng Python với Gunicorn
        schemaVersion: 1.0
        
        constants:
          - AppDir:
              type: string
              value: /home/ec2-user/app
          - ServiceName:
              type: string
              value: python-app
        
        phases:
          - name: build
            steps:
              # Step 1: Cập nhật system và cài đặt base packages
              - name: UpdateAndInstallBase
                action: ExecuteBash
                onFailure: Abort
                inputs:
                  commands:
                    - |
                      echo "===== Bước 1: Cập nhật hệ thống và cài đặt packages cơ bản ====="
                      sudo dnf update -y
                      
                      # Cài đặt các packages tương đương với Ubuntu
                      sudo dnf install -y nmap-ncat gcc gcc-c++ make postgresql-devel python3-devel
                      
                      echo "✓ Đã cài đặt xong base packages"
              
              # Step 2: Cài đặt Python 3.12
              - name: InstallPython312
                action: ExecuteBash
                onFailure: Abort
                inputs:
                  commands:
                    - |
                      echo "===== Bước 2: Cài đặt Python 3.12 ====="
                      
                      sudo dnf install -y python3.12 python3.12-pip python3.12-devel
                      sudo alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 1
                      sudo alternatives --set python3 /usr/bin/python3.12
                      sudo ln -sf /usr/bin/pip3.12 /usr/bin/pip3
                      
                      python3 --version
                      pip3 --version
                      echo "✓ Python 3.12 đã được cài đặt"
              
              # Step 3: Cài đặt Git
              - name: InstallGit
                action: ExecuteBash
                onFailure: Abort
                inputs:
                  commands:
                    - |
                      echo "===== Bước 3: Cài đặt Git ====="
                      sudo dnf install -y git
                      git --version
                      echo "✓ Git đã được cài đặt"
              
              # Step 4: Clone repository
              - name: CloneRepository
                action: ExecuteBash
                onFailure: Abort
                inputs:
                  commands:
                    - |
                      echo "===== Bước 4: Clone source code từ GitHub ====="
                      
                      [ -d "{{ AppDir }}" ] && sudo rm -rf {{ AppDir }}
                      
                      cd /home/ec2-user
                      git clone ${GitRepositoryUrl} app
                      sudo chown -R ec2-user:ec2-user {{ AppDir }}
                      
                      echo "✓ Đã clone xong repository"
                      ls -la {{ AppDir }}
              
              # Step 5: Cài đặt Python dependencies
              - name: InstallPythonDependencies
                action: ExecuteBash
                onFailure: Abort
                inputs:
                  commands:
                    - |
                      echo "===== Bước 5: Cài đặt Python dependencies ====="
                      
                      cd {{ AppDir }}
                      pip3 install --upgrade pip
                      pip3 install gunicorn
                      
                      if [ -f requirements.txt ]; then
                        pip3 install -r requirements.txt
                        echo "✓ Đã cài đặt xong requirements.txt"
                      else
                        echo "⚠ Không tìm thấy requirements.txt"
                      fi
                      
                      pip3 show gunicorn
              
              # Step 6: Tạo startup script
              - name: CreateStartupScript
                action: CreateFile
                onFailure: Abort
                inputs:
                  path: '{{ AppDir }}/start.sh'
                  content: |
                    #!/bin/bash
                    set -e
                    
                    echo "Loading environment variables..."
                    
                    export DB_URL=$(aws ssm get-parameter \
                      --name "${DBUrlParameterPath}" \
                      --query 'Parameter.Value' \
                      --output text \
                      --region ${AWS::Region} 2>/dev/null || echo "localhost")
                    
                    export DB_PASSWORD=$(aws secretsmanager get-secret-value \
                      --secret-id "${DBPasswordSecretId}" \
                      --query SecretString \
                      --output text \
                      --region ${AWS::Region} 2>/dev/null || echo "default_password")
                    
                    export DB_PORT=5432
                    export PORT=80
                    
                    echo "Configuration:"
                    echo "  DB_URL: $DB_URL"
                    echo "  DB_PORT: $DB_PORT"
                    echo "  APP_PORT: $PORT"
                    
                    echo "Checking database connection..."
                    counter=0
                    while ! nc -z $DB_URL $DB_PORT 2>/dev/null; do
                        sleep 0.1
                        counter=$((counter + 1))
                        if [ $counter -ge 600 ]; then
                            echo "Timeout: Không thể kết nối PostgreSQL sau 60 giây."
                            exit 1
                        fi
                    done
                    echo "PostgreSQL started"
                    
                    echo "Starting Gunicorn server..."
                    cd {{ AppDir }}
                    exec gunicorn -b 0.0.0.0:$PORT manage:app \
                      --workers 4 \
                      --timeout 120 \
                      --log-level info
                  permissions: '755'
                  owner: 'ec2-user'
                  group: 'ec2-user'
              
              # Step 7: Tạo systemd service
              - name: CreateSystemdService
                action: CreateFile
                onFailure: Abort
                inputs:
                  path: '/etc/systemd/system/{{ ServiceName }}.service'
                  content: |
                    [Unit]
                    Description=Python Application with Gunicorn
                    After=network.target
                    
                    [Service]
                    Type=simple
                    User=ec2-user
                    Group=ec2-user
                    WorkingDirectory={{ AppDir }}
                    Environment="PATH=/usr/local/bin:/usr/bin:/bin"
                    Environment="LANG=en_US.UTF-8"
                    ExecStart={{ AppDir }}/start.sh
                    Restart=always
                    RestartSec=10
                    StandardOutput=journal
                    StandardError=journal
                    SyslogIdentifier={{ ServiceName }}
                    
                    [Install]
                    WantedBy=multi-user.target
                  permissions: '644'
                  owner: 'root'
                  group: 'root'
              
              # Step 8: Enable service
              - name: EnableService
                action: ExecuteBash
                onFailure: Abort
                inputs:
                  commands:
                    - |
                      echo "===== Bước 8: Enable systemd service ====="
                      sudo systemctl daemon-reload
                      sudo systemctl enable {{ ServiceName }}.service
                      echo "✓ Service đã được enable"
          
          - name: validate
            steps:
              - name: ValidateSetup
                action: ExecuteBash
                onFailure: Abort
                inputs:
                  commands:
                    - |
                      echo "===== Validation Phase ====="
                      
                      python3 --version || exit 1
                      git --version || exit 1
                      pip3 show gunicorn || exit 1
                      [ -d "{{ AppDir }}" ] || exit 1
                      [ -f "{{ AppDir }}/start.sh" ] || exit 1
                      [ -f "/etc/systemd/system/{{ ServiceName }}.service" ] || exit 1
                      systemctl is-enabled {{ ServiceName }}.service || exit 1
                      
                      echo "✓ Tất cả validation đã pass"

  # ==========================================
  # Infrastructure Configuration
  # ==========================================
  InfrastructureConfig:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Properties:
      Name: !Sub '${AWS::StackName}-infra-config'
      Description: 'Infrastructure configuration cho Image Builder'
      InstanceProfileName: !Ref ImageBuilderInstanceProfile
      InstanceTypes:
        - t3.medium
        - t3.small
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      TerminateInstanceOnFailure: true
      ResourceTags:
        Name: 'SOA-InfraConfig-BuilderInstance'
        Environment: 'SOA'
        Purpose: 'ImageBuilding'

  # ==========================================
  # Image Recipe
  # ==========================================
  AppImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: !Sub '${AWS::StackName}-recipe'
      Version: '1.0.0'
      Description: 'Recipe cho Python application trên Amazon Linux 2023'
      ParentImage: !Sub 'arn:aws:imagebuilder:${AWS::Region}:aws:image/amazon-linux-2023-x86/x.x.x'
      Components:
        - ComponentArn: !Ref ApplicationBuildComponent
      BlockDeviceMappings:
        - DeviceName: '/dev/xvda'
          Ebs:
            VolumeSize: 20
            VolumeType: 'gp3'
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        Name: 'SOA-Recipe-PythonApp'
        Environment: 'SOA'
        BaseOS: 'AmazonLinux2023'

  # ==========================================
  # Distribution Configuration
  # ==========================================
  DistributionConfig:
    Type: AWS::ImageBuilder::DistributionConfiguration
    Properties:
      Name: !Sub '${AWS::StackName}-distribution'
      Description: 'Distribution configuration - Private AMI'
      Distributions:
        - Region: !Ref AWS::Region
          AmiDistributionConfiguration:
            Name: 'SOA-AMI-PythonApp-{{imagebuilder:buildDate}}'
            Description: 'SOA Python application AMI built on {{imagebuilder:buildDate}}'
            AmiTags:
              Name: 'SOA-AMI-PythonApplication'
              Environment: 'SOA'
              BuildDate: '{{imagebuilder:buildDate}}'
              SourcePipeline: !Sub '${AWS::StackName}'
            # Private AMI - chỉ owner access
            LaunchPermissionConfiguration:
              UserGroups: []
              UserIds: []

  # ==========================================
  # Image Pipeline - Manual Trigger
  # ==========================================
  ImagePipeline:
    Type: AWS::ImageBuilder::ImagePipeline
    Properties:
      Name: !Sub '${AWS::StackName}-pipeline'
      Description: 'Manual trigger pipeline cho Python application'
      ImageRecipeArn: !Ref AppImageRecipe
      InfrastructureConfigurationArn: !Ref InfrastructureConfig
      DistributionConfigurationArn: !Ref DistributionConfig
      Status: ENABLED
      # Không set Schedule để manual trigger
      ImageTestsConfiguration:
        ImageTestsEnabled: false
        TimeoutMinutes: 60
      Tags:
        Name: 'SOA-Pipeline-ManualTrigger'
        Environment: 'SOA'
        TriggerType: 'Manual'

  # ==========================================
  # Custom Resource để trigger và track AMI build
  # ==========================================
  AMIBuilder:
    Type: Custom::AMIBuilder
    DependsOn:
      - ImagePipeline
      - AMIBuilderFunction
    Properties:
      ServiceToken: !GetAtt AMIBuilderFunction.Arn
      PipelineArn: !GetAtt ImagePipeline.Arn
      AutoBuild: !Ref AutoBuildOnCreate

  # ==========================================
  # Wait Condition (Alternative approach)
  # ==========================================
  WaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle
    Condition: UseWaitCondition

  WaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    Condition: UseWaitCondition
    Properties:
      Handle: !Ref WaitHandle
      Timeout: '3600'  # 1 hour timeout
      Count: 1

Conditions:
  UseWaitCondition: !Equals [!Ref AutoBuildOnCreate, 'false']

Outputs:
  PipelineArn:
    Description: 'ARN của Image Pipeline'
    Value: !GetAtt ImagePipeline.Arn
    Export:
      Name: !Sub '${AWS::StackName}-PipelineArn'
  
  AMIId:
    Description: 'AMI ID (nếu auto build được enable)'
    Value: !If
      - UseWaitCondition
      - 'Manual trigger mode - no AMI built'
      - !GetAtt AMIBuilder.AMIId
    Export:
      Name: !Sub '${AWS::StackName}-AMIId'
  
  BuildStatus:
    Description: 'Build Status'
    Value: !GetAtt AMIBuilder.Status
  
  ManualTriggerCommand:
    Description: 'Command để trigger pipeline manually'
    Value: !Sub |
      aws imagebuilder start-image-pipeline-execution \
        --image-pipeline-arn ${ImagePipeline.Arn} \
        --region ${AWS::Region}
  
  TrackBuildCommand:
    Description: 'Command để track build status'
    Value: !Sub |
      aws imagebuilder list-image-pipeline-images \
        --image-pipeline-arn ${ImagePipeline.Arn} \
        --query 'imageSummaryList[0].state' \
        --region ${AWS::Region}